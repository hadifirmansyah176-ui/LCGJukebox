name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Susun file proyek
        run: |
          W=.github/workflows
          P=app/src/main/java/com/musikH/lcgjukebos
          mkdir -p app/src/main/res/layout app/src/main/res/drawable-nodpi $P
          cp $W/settings.gradle.kts settings.gradle.kts
          cp $W/build.gradle.kts build.gradle.kts
          cp $W/gradle.properties gradle.properties
          cp "$(find $W -name build.gradle.kts -path '*/app/*' | head -1)" app/build.gradle.kts
          cp "$(find $W -name AndroidManifest.xml | head -1)" app/src/main/AndroidManifest.xml
          cp "$(find $W -name activity_main.xml | head -1)" app/src/main/res/layout/activity_main.xml
          cp "$(find $W -name PlayerServiceBaru.kt | head -1)" $P/PlayerService.kt
          cp "$(find $W -name MainActivityBaru.kt | head -1)" $P/MainActivity.kt
          sed -i 's/com\.hadi\.lcgjukebox/com.musikH.lcgjukebos/g' app/build.gradle.kts
          for f in vol_up vol_down; do
            F=$(find . -name "$f.png" -not -path './.git/*' -not -path './app/*' | head -1)
            if [ -n "$F" ]; then cp "$F" app/src/main/res/drawable-nodpi/$f.png; else echo "$f.png tidak ada, tombol digambar manual"; fi
          done
          grep -n "namespace\|applicationId" app/build.gradle.kts

      - name: Buat ikon aplikasi
        run: |
          ICON=$(find . -name 'download.jpg' -not -path './.git/*' | head -1)
          if [ -z "$ICON" ]; then echo "download.jpg tidak ada, ikon bawaan dipakai"; exit 0; fi
          (pip install pillow || pip install --break-system-packages pillow)
          ICON="$ICON" python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          src = Image.open(os.environ["ICON"]).convert("RGBA")
          w, h = src.size
          s = min(w, h)
          l, t = (w - s) // 2, (h - s) // 2
          src = src.crop((l, t, l + s, t + s))
          for d, px in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              im = src.resize((px, px), Image.LANCZOS)
              mask = Image.new("L", (px, px), 0)
              ImageDraw.Draw(mask).rounded_rectangle((0, 0, px - 1, px - 1), radius=px // 5, fill=255)
              im.putalpha(mask)
              os.makedirs(f"app/src/main/res/mipmap-{d}", exist_ok=True)
              im.save(f"app/src/main/res/mipmap-{d}/ic_launcher.png")
          PY
          sed -i 's#@android:drawable/ic_media_play#@mipmap/ic_launcher#' app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LCGJukebox-apk
          path: app/build/outputs/apk/debug/app-debug.apk
