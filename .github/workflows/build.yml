name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Susun file proyek
        run: |
          W=.github/workflows
          mkdir -p app/src/main/res/layout app/src/main/java/com/hadi/lcgjukebox
          cp $W/settings.gradle.kts settings.gradle.kts
          cp $W/build.gradle.kts build.gradle.kts
          cp $W/gradle.properties gradle.properties
          cp "$(find $W -name build.gradle.kts -path '*/app/*' | head -1)" app/build.gradle.kts
          cp "$(find $W -name AndroidManifest.xml | head -1)" app/src/main/AndroidManifest.xml
          cp "$(find $W -name activity_main.xml | head -1)" app/src/main/res/layout/activity_main.xml
          cp "$(find $W -name PlayerService.kt | head -1)" app/src/main/java/com/hadi/lcgjukebox/PlayerService.kt
          cp $W/MainActivityBaru.kt app/src/main/java/com/hadi/lcgjukebox/MainActivity.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LCGJukebox-apk
          path: app/build/outputs/apk/debug/app-debug.apk
