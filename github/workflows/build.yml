name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Ekstrak proyek
        run: unzip -o RealOnePlayer.zip -d proj

      - name: Build debug APK
        working-directory: proj/RealOnePlayer
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RealOnePlayer-debug
          path: proj/RealOnePlayer/app/build/outputs/apk/debug/app-debug.apk
